# Usage:
#   cp .env.example .env   # fill in the values
#   docker compose up -d
# App: http://localhost:8080   n8n: http://localhost:5678
# Audits are stored in an in-memory H2 database and are cleared on restart.

services:

  app:
    build: .
    container_name: aisec-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Inside the container the app must listen on all interfaces; the host port stays bound to localhost
      SERVER_ADDRESS: 0.0.0.0
      DEFAULT_CLIENT_API_KEY: ${DEFAULT_CLIENT_API_KEY:?Set DEFAULT_CLIENT_API_KEY in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:?Set CLAUDE_API_KEY in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      SEMGREP_ENABLED: ${SEMGREP_ENABLED:-true}

  n8n:
    image: n8nio/n8n:latest
    container_name: aisec-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?Set N8N_PASSWORD in .env}
      WEBHOOK_URL: http://localhost:5678
      SPRING_BOOT_URL: http://app:8080
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DEFAULT_CLIENT_API_KEY: ${DEFAULT_CLIENT_API_KEY:?Set DEFAULT_CLIENT_API_KEY in .env}
      GENERIC_TIMEZONE: Europe/Warsaw
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - app

volumes:
  n8n_data:
