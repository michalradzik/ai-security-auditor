# Usage:
#   cp .env.example .env   # fill in the values
#   docker compose up -d
# App: http://localhost:8080   n8n: http://localhost:5678

services:

  postgres:
    image: postgres:16-alpine
    container_name: aisec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisecaudit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: aisec-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/aisecaudit
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:?Set CLAUDE_API_KEY in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      SEMGREP_ENABLED: ${SEMGREP_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: aisec-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?Set N8N_PASSWORD in .env}
      WEBHOOK_URL: http://localhost:5678
      SPRING_BOOT_URL: http://app:8080
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DEFAULT_CLIENT_API_KEY: ${DEFAULT_CLIENT_API_KEY:?Set DEFAULT_CLIENT_API_KEY in .env}
      GENERIC_TIMEZONE: Europe/Warsaw
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - app

volumes:
  postgres_data:
  n8n_data:
